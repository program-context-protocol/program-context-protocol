[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "program-context-protocol"
version = "0.2.1"
description = "PCP — prevent LLM hallucination and context drift across dev sessions"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "rich>=13.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
# Community-detection enrichment on top of validate-strategy's deterministic
# coupling_score (see coupling.py) — surfaces informal module clusters beyond
# declared dependencies. Optional: pulls in numpy + ~20 tree-sitter grammars,
# not needed for the core coupling computation, which only needs networkx.
graph = ["graphifyy>=0.8"]
# Process/workflow layer (Tier 2, Phase C): durability/retry spine wrapping
# pcp build's existing per-module loop as a Temporal Activity/Workflow.
# Only imported if `pcp process-worker` is actually invoked — everything
# else in PCP works with zero awareness of this extra. Also requires the
# separate `temporal` CLI (not pip-installable) for `temporal server
# start-dev` locally; not needed just to install this extra.
process = ["temporalio>=1.30"]

[project.scripts]
pcp = "pcp.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pcp"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.hatch.envs.default.scripts]
test = "pytest tests/ -v"
