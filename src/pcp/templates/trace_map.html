<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PCP Traceability Map</title>
<style>
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface-2: #ecebe6; --border: #dcdad2;
    --text: #1c1d1f; --muted: #6b6d74; --accent: #a3742f; --accent-soft: #f1e4cc;
    --red: #b3382c; --red-bg: #f8e2df; --blue: #2559a8; --blue-bg: #dfe8f8;
    --green: #1f7a4d; --green-bg: #dcf0e4;
    --shadow: 0 1px 2px rgba(20,20,15,.06), 0 6px 20px rgba(20,20,15,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a; --surface: #181d27; --surface-2: #1f2530; --border: #2a3140;
      --text: #e7eaf0; --muted: #8b93a7; --accent: #d1a35c; --accent-soft: #3a2f1c;
      --red: #ff8078; --red-bg: #3a1e1d; --blue: #7db0ff; --blue-bg: #1c2a42;
      --green: #6bd99a; --green-bg: #16332470;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .shell { display: flex; flex-direction: column; height: 100%; }
  header { padding: 0.9rem 1.2rem; border-bottom: 1px solid var(--border); background: var(--surface); }
  .eyebrow { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0.1rem 0 0; }
  .body { flex: 1; display: flex; min-height: 0; }

  #catalog { width: 340px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); }
  #search { border: none; border-bottom: 1px solid var(--border); padding: 0.7rem 1rem; font-size: 0.85rem;
    background: transparent; color: var(--text); }
  #search:focus { outline: none; background: var(--bg); }
  #feature-list { flex: 1; overflow-y: auto; }
  .feature-row {
    padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; gap: 0.3rem;
  }
  .feature-row:hover { background: var(--bg); }
  .feature-row.active { background: var(--accent-soft); }
  .feature-row .fr-id { font-size: 0.68rem; font-weight: 700; color: var(--accent); }
  .feature-row .fr-desc { font-size: 0.78rem; line-height: 1.4; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fr-status { display: flex; gap: 0.3rem; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.none { background: var(--muted); opacity: 0.4; }

  #detail { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }
  #detail .placeholder { color: var(--muted); font-size: 0.85rem; margin-top: 2rem; text-align: center; }
  .detail-header { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.4rem; }
  .detail-header .d-id { font-size: 0.75rem; font-weight: 700; color: var(--accent); }
  .detail-desc { font-size: 0.92rem; line-height: 1.55; max-width: 68ch; margin-bottom: 0.5rem; }
  .drift-flag {
    background: var(--red-bg); color: var(--red); border-radius: 8px; padding: 0.6rem 0.9rem;
    font-size: 0.78rem; margin: 0.8rem 0 1.2rem; max-width: 68ch;
  }
  .drift-flag b { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.2rem; }

  .section-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 1.4rem 0 0.6rem; }
  .link-card { border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.7rem; background: var(--surface); max-width: 68ch; }
  .link-card-top { display: flex; align-items: center; gap: 0.6rem; }
  .link-module { font-weight: 600; font-size: 0.88rem; flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.18rem 0.55rem; border-radius: 999px; font-size: 0.68rem; font-weight: 600; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.red { color: var(--red); background: var(--red-bg); }
  .pill.blue { color: var(--blue); background: var(--blue-bg); }
  .pill.green { color: var(--green); background: var(--green-bg); }
  .pill.status-complete { color: var(--green); background: var(--green-bg); }
  .pill.status-pending { color: var(--muted); background: var(--surface-2); }
  .conf { font-size: 0.7rem; color: var(--muted); }
  .rationale { font-size: 0.8rem; color: var(--muted); margin: 0.5rem 0 0.7rem; line-height: 1.5; }
  .link-actions { display: flex; gap: 0.4rem; }
  .act-btn {
    font-size: 0.72rem; font-weight: 600; border-radius: 6px; padding: 0.35rem 0.65rem;
    cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .act-btn.approve:hover { border-color: var(--green); color: var(--green); }
  .act-btn.reject:hover { border-color: var(--red); color: var(--red); }
  .act-btn.edit:hover { border-color: var(--accent); color: var(--accent); }

  .criteria-list { margin-top: 0.6rem; border-top: 1px dashed var(--border); padding-top: 0.6rem; display: flex; flex-direction: column; gap: 0.4rem; }
  .criterion-row { display: flex; align-items: baseline; gap: 0.5rem; font-size: 0.76rem; }
  .criterion-row .c-id { color: var(--muted); flex: none; width: 3.2rem; }
  .criterion-row .c-desc { flex: 1; }
  .empty-note { color: var(--muted); font-size: 0.8rem; }

  #toast {
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%) translateY(120%);
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 0.6rem 1rem; border-radius: 8px; box-shadow: var(--shadow);
    font-size: 0.8rem; transition: transform 0.2s ease; z-index: 10;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>
<div class="shell">
  <header>
    <span class="eyebrow">pcp trace-serve · feature &rarr; module &rarr; code</span>
    <h1 id="title">Traceability Map</h1>
  </header>
  <div class="body">
    <div id="catalog">
      <input id="search" placeholder="Search features…" />
      <div id="feature-list"></div>
    </div>
    <div id="detail"><div class="placeholder">Select a feature on the left.</div></div>
  </div>
</div>
<div id="toast"></div>

<script>
let data = { features: [], modules: [], links: [] };
let selectedFeatureId = null;

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = isErr ? 'show err' : 'show';
  setTimeout(() => t.className = '', 2600);
}

function linksForFeature(featureId) {
  return data.links.filter(l => l.feature_id === featureId);
}
function moduleByName(name) {
  return data.modules.find(m => m.name === name);
}
function featureStatusDots(featureId) {
  const links = linksForFeature(featureId);
  if (!links.length) return '<span class="dot none"></span>';
  return links.map(l => `<span class="dot" style="background: var(--${l.review_status})"></span>`).join('');
}

async function loadData() {
  const res = await fetch('/api/trace');
  data = await res.json();
  document.getElementById('title').textContent = `Traceability Map — ${data.project_name || 'project'}`;
  renderFeatureList();
  if (selectedFeatureId) renderDetail(selectedFeatureId);
}

function renderFeatureList(query) {
  const q = (query || document.getElementById('search').value || '').trim().toLowerCase();
  const list = document.getElementById('feature-list');
  const filtered = data.features.filter(f => !q || f.description.toLowerCase().includes(q) || f.id.toLowerCase().includes(q));
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-note" style="padding:1rem;">No matching features.</div>';
    return;
  }
  list.innerHTML = filtered.map(f => `
    <div class="feature-row ${f.id === selectedFeatureId ? 'active' : ''}" onclick="selectFeature('${f.id}')">
      <div class="fr-id">${esc(f.id)}</div>
      <div class="fr-desc">${esc(f.description)}</div>
      <div class="fr-status">${featureStatusDots(f.id)}</div>
    </div>
  `).join('');
}

function selectFeature(id) {
  selectedFeatureId = id;
  renderFeatureList();
  renderDetail(id);
}

function renderDetail(featureId) {
  const feature = data.features.find(f => f.id === featureId);
  if (!feature) return;
  const links = linksForFeature(featureId);
  const detail = document.getElementById('detail');

  let html = `
    <div class="detail-header"><span class="d-id">${esc(feature.id)}</span></div>
    <div class="detail-desc">${esc(feature.description)}</div>
  `;
  if (feature.drift_flag) {
    html += `<div class="drift-flag"><b>Drift flag</b>${esc(feature.drift_flag)}</div>`;
  }

  html += `<div class="section-label">Suggested implementing module(s)</div>`;
  if (!links.length) {
    html += `<div class="empty-note">No module match suggested. Run <code>pcp trace-map</code>, or this requirement may not be implemented yet.</div>`;
  } else {
    html += links.map(l => {
      const mod = moduleByName(l.module);
      let criteriaHtml = '';
      if (l.review_status === 'green' && mod) {
        if (mod.criteria.length) {
          criteriaHtml = `<div class="criteria-list">` + mod.criteria.map(c => `
            <div class="criterion-row">
              <span class="c-id mono">${esc(c.id)}</span>
              <span class="c-desc">${esc(c.description)}</span>
              <span class="pill status-${c.status === 'complete' ? 'complete' : 'pending'}">${esc(c.status)}</span>
            </div>
          `).join('') + `</div>`;
        } else {
          criteriaHtml = `<div class="criteria-list"><span class="empty-note">No acceptance criteria recorded for this module.</span></div>`;
        }
      }
      return `
      <div class="link-card">
        <div class="link-card-top">
          <span class="link-module mono">${esc(l.module)}</span>
          <span class="conf">${(l.confidence_score * 100).toFixed(0)}%</span>
          <span class="pill ${l.review_status}">${l.review_status}</span>
        </div>
        <div class="rationale">${esc(l.rationale || '')}</div>
        <div class="link-actions">
          <button class="act-btn approve" onclick="act('${l.id}','approve')">Approve</button>
          <button class="act-btn edit" onclick="onEdit('${l.id}')">Edit module</button>
          <button class="act-btn reject" onclick="act('${l.id}','reject')">Reject</button>
        </div>
        ${criteriaHtml}
      </div>`;
    }).join('');
  }

  detail.innerHTML = html;
}

function onEdit(linkId) {
  const label = window.prompt('Correct module name:');
  if (label && label.trim()) act(linkId, 'edit', label.trim());
}

async function act(linkId, action, newLabel) {
  try {
    const res = await fetch('/api/trace-review', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: linkId, action, new_label: newLabel || null }),
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'request failed');
    showToast(`${action} applied`);
    await loadData();
  } catch (e) {
    showToast(e.message, true);
  }
}

document.getElementById('search').addEventListener('input', () => renderFeatureList());

loadData();
</script>
</body>
</html>
