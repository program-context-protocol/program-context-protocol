<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PCP Ontology Graph</title>
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --border: #dcdad2; --text: #1c1d1f; --muted: #6b6d74;
    --accent: #a3742f; --red: #b3382c; --blue: #2559a8; --green: #1f7a4d;
    --red-bg: #f8e2df; --blue-bg: #dfe8f8; --green-bg: #dcf0e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a; --surface: #181d27; --border: #2a3140; --text: #e7eaf0; --muted: #8b93a7;
      --accent: #d1a35c; --red: #ff8078; --blue: #7db0ff; --green: #6bd99a;
      --red-bg: #3a1e1d; --blue-bg: #1c2a42; --green-bg: #16332470;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .shell { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.1rem;
    border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; white-space: nowrap; }
  .eyebrow { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .stats { display: flex; gap: 0.5rem; margin-left: auto; }
  .chip {
    display: flex; align-items: center; gap: 0.35rem; border: 1px solid var(--border); border-radius: 999px;
    padding: 0.3rem 0.7rem; font-size: 0.75rem; cursor: pointer; background: var(--surface); color: var(--text);
  }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--muted)); }
  .chip.active { border-color: var(--dot, var(--accent)); background: var(--chip-bg, transparent); }
  .search {
    border: 1px solid var(--border); border-radius: 8px; padding: 0.4rem 0.7rem; font-size: 0.8rem;
    background: var(--surface); color: var(--text); width: 220px;
  }
  .body { flex: 1; display: flex; min-height: 0; }
  #graph { flex: 1; }
  #panel {
    width: 320px; border-left: 1px solid var(--border); background: var(--surface);
    padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem;
  }
  #panel .placeholder { color: var(--muted); font-size: 0.82rem; }
  .field { font-size: 0.78rem; line-height: 1.5; }
  .field b { display: block; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.15rem; }
  .pill {
    display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.15rem 0.5rem; border-radius: 999px;
    font-size: 0.68rem; font-weight: 600;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.red { color: var(--red); background: var(--red-bg); }
  .pill.blue { color: var(--blue); background: var(--blue-bg); }
  .pill.green { color: var(--green); background: var(--green-bg); }
  .actions { display: flex; gap: 0.4rem; margin-top: 0.3rem; }
  .act-btn {
    flex: 1; font-size: 0.72rem; font-weight: 600; border-radius: 6px; padding: 0.4rem 0.3rem;
    cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .act-btn.approve:hover { border-color: var(--green); color: var(--green); }
  .act-btn.reject:hover { border-color: var(--red); color: var(--red); }
  .act-btn.edit:hover { border-color: var(--accent); color: var(--accent); }
  .act-btn:disabled { opacity: 0.4; cursor: default; }
  .conn-list { display: flex; flex-direction: column; gap: 0.3rem; }
  .conn-row {
    display: flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.5rem; border-radius: 6px;
    border: 1px solid var(--border); cursor: pointer; font-size: 0.75rem;
  }
  .conn-row:hover { background: var(--bg); }
  .conn-arrow { color: var(--muted); font-weight: 700; }
  .conn-name { flex: 1; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .conn-rel { color: var(--muted); font-size: 0.68rem; white-space: nowrap; }
  .field .conn-name, .field .conn-rel { display: inline; }
  #toast {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%) translateY(120%);
    background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.9rem;
    border-radius: 8px; font-size: 0.78rem; transition: transform 0.2s ease; z-index: 20;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: var(--red); color: var(--red); }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.85rem; }

  #community-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 30;
    display: flex; align-items: center; justify-content: center; padding: 2rem;
  }
  #community-modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    width: min(760px, 100%); max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  #community-modal-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--border);
  }
  #community-modal-header h2 { margin: 0; font-size: 1rem; font-weight: 600; }
  #community-list { overflow-y: auto; padding: 0.6rem 1.3rem 1.3rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .community-row {
    display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.8rem; border: 1px solid var(--border);
    border-radius: 10px; cursor: pointer; font-size: 0.78rem;
  }
  .community-row:hover { background: var(--bg); }
  .community-row .cr-main { flex: 1; min-width: 0; }
  .community-row .cr-samples { color: var(--muted); font-size: 0.7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .community-row .cr-counts { display: flex; gap: 0.35rem; flex: none; }
  .community-row .cr-actions { display: flex; gap: 0.3rem; flex: none; }
  .community-row .cr-actions .act-btn { padding: 0.3rem 0.55rem; font-size: 0.68rem; flex: none; }
  .cr-total { font-weight: 700; font-size: 0.85rem; flex: none; width: 2.4rem; text-align: right; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <span class="eyebrow">pcp ontology-serve · graph</span>
      <h1 id="title">Ontology Graph</h1>
    </div>
    <input class="search" id="search" placeholder="Highlight nodes…" />
    <button class="chip" id="chip-semantic" style="--dot: var(--accent)" title="Hide code nodes + structural edges (contains/calls/references/imports_from/uses) — show only rationale/concept/document nodes and the meaning-carrying edges (rationale_for/conceptually_related_to/semantically_similar_to/shares_data_with)">Semantic only <span id="c-semantic">0</span></button>
    <button class="chip" id="chip-communities" style="--dot: var(--accent)" title="Too many items to review one at a time — decide per group instead. Approve or reject a whole community in one action.">Review by group</button>
    <div class="stats" role="group" aria-label="Filter by status">
      <button class="chip" id="chip-all" style="--dot: var(--text)">All <span id="c-all">0</span></button>
      <button class="chip" id="chip-red" style="--dot: var(--red); --chip-bg: var(--red-bg)">Red <span id="c-red">0</span></button>
      <button class="chip" id="chip-blue" style="--dot: var(--blue); --chip-bg: var(--blue-bg)">Blue <span id="c-blue">0</span></button>
      <button class="chip" id="chip-green" style="--dot: var(--green); --chip-bg: var(--green-bg)">Green <span id="c-green">0</span></button>
    </div>
  </header>
  <div class="body">
    <div style="position:relative; flex:1;">
      <div id="graph" style="width:100%; height:100%;"></div>
      <div id="loading">Loading graph…</div>
    </div>
    <div id="panel"><div class="placeholder">Click a node or edge to inspect it.</div></div>
  </div>
</div>
<div id="toast"></div>

<div id="community-overlay" style="display:none;">
  <div id="community-modal">
    <div id="community-modal-header">
      <div>
        <h2>Review by group</h2>
        <div class="eyebrow" style="margin-top:0.2rem;">One decision per community instead of one per item — approve or reject everything in a group at once. Click a row to preview it in the graph first.</div>
      </div>
      <button class="act-btn" id="community-close" style="flex:none; padding:0.4rem 0.8rem;">Close</button>
    </div>
    <div id="community-list"></div>
  </div>
</div>

<script>
let allNodes = [], allEdges = [];
let nodesDS, edgesDS, network;
let statusFilter = 'all';
let selected = null;
let semanticOnly = false;

// "code" nodes are structural (functions, files, schema keys); rationale/
// concept/document nodes carry actual meaning. Same split for edges:
// contains/calls/references/imports_from/uses/method are AST-derived
// structure; the rest are the semantic subagent's own relation vocabulary.
const SEMANTIC_NODE_TYPES = new Set(['rationale', 'concept', 'document']);
const SEMANTIC_RELATIONS = new Set(['rationale_for', 'conceptually_related_to', 'semantically_similar_to', 'shares_data_with']);
function isSemanticNode(n) { return SEMANTIC_NODE_TYPES.has(n.detail); }
function isSemanticEdge(e) { return SEMANTIC_RELATIONS.has(e.relation); }

const COLOR = {
  red: { background: getVar('--red'), border: getVar('--red') },
  blue: { background: getVar('--blue'), border: getVar('--blue') },
  green: { background: getVar('--green'), border: getVar('--green') },
};
function getVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = isErr ? 'show err' : 'show';
  setTimeout(() => t.className = '', 2600);
}

async function loadGraph() {
  const res = await fetch('/api/graph');
  const data = await res.json();
  document.getElementById('title').textContent = `Ontology Graph — ${data.project_name || 'project'}`;

  allNodes = data.nodes;
  allEdges = data.edges;

  const counts = { all: allNodes.length + allEdges.length, red: 0, blue: 0, green: 0 };
  let semanticCount = 0;
  for (const it of [...allNodes, ...allEdges]) counts[it.status]++;
  for (const n of allNodes) if (isSemanticNode(n)) semanticCount++;
  for (const e of allEdges) if (isSemanticEdge(e)) semanticCount++;
  document.getElementById('c-all').textContent = counts.all.toLocaleString();
  document.getElementById('c-red').textContent = counts.red.toLocaleString();
  document.getElementById('c-blue').textContent = counts.blue.toLocaleString();
  document.getElementById('c-green').textContent = counts.green.toLocaleString();
  document.getElementById('c-semantic').textContent = semanticCount.toLocaleString();

  // Semantic-only mode: keep semantic edges, plus any node that either IS
  // semantically typed or is an endpoint of a kept edge -- a code node that
  // bridges to a concept via conceptually_related_to/shares_data_with is
  // exactly the interesting cross-link, hiding it would erase the bridge.
  const keptEdgeIds = new Set(allEdges.filter(isSemanticEdge).map(e => e.id));
  const nodeIsBridgeEndpoint = new Set();
  for (const e of allEdges) {
    if (keptEdgeIds.has(e.id)) { nodeIsBridgeEndpoint.add(e.from); nodeIsBridgeEndpoint.add(e.to); }
  }
  function nodeVisibleInSemanticMode(n) { return isSemanticNode(n) || nodeIsBridgeEndpoint.has(n.id); }

  const visNodes = allNodes.map(n => ({
    id: n.id, label: n.kind === 'node' ? truncate(n.name, 22) : '',
    shape: n.kind === 'node' ? 'dot' : 'dot', size: n.kind === 'node' ? 9 : 3,
    color: COLOR[n.status], font: { size: n.kind === 'node' ? 11 : 0, color: getVar('--text') },
    title: n.name, hidden: semanticOnly && !nodeVisibleInSemanticMode(n), _raw: n,
  }));
  nodesDS = new vis.DataSet(visNodes);

  const visEdges = allEdges.map(e => ({
    id: e.id, from: e.from, to: e.to,
    color: { color: COLOR[e.status].background, opacity: 0.55 },
    width: e.status === 'green' ? 2 : 1,
    arrows: { to: { enabled: true, scaleFactor: 0.4 } },
    title: e.name, hidden: semanticOnly && !keptEdgeIds.has(e.id), _raw: e,
  }));
  edgesDS = new vis.DataSet(visEdges);

  const container = document.getElementById('graph');
  network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
    physics: {
      enabled: true, solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -60, centralGravity: 0.005, springLength: 120, springConstant: 0.08, damping: 0.4, avoidOverlap: 0.8 },
      stabilization: { iterations: 200, fit: true },
    },
    interaction: { hover: true, tooltipDelay: 100, hideEdgesOnDrag: true, navigationButtons: false, keyboard: false },
    nodes: { shape: 'dot', borderWidth: 1.5 },
    edges: { smooth: { type: 'continuous', roundness: 0.2 }, selectionWidth: 3 },
  });
  network.once('stabilizationIterationsDone', () => {
    network.setOptions({ physics: { enabled: false } });
    document.getElementById('loading').style.display = 'none';
  });
  network.on('click', params => {
    if (params.nodes.length) showPanel(params.nodes[0], 'node');
    else if (params.edges.length) showPanel(params.edges[0], 'edge');
    else clearPanel();
  });
}

function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

function nodeName(id) {
  const n = nodesDS.get(id);
  return n ? n._raw.name : id;
}

function edgeRelation(raw) {
  return raw.relation || 'related_to';
}

function connectionsHtml(nodeId) {
  const edgeIds = network.getConnectedEdges(nodeId);
  if (!edgeIds.length) return '<div class="field placeholder">No connections.</div>';
  const rows = edgeIds.map(eid => {
    const e = edgesDS.get(eid);
    if (!e) return '';
    const raw = e._raw;
    const outgoing = raw.from === nodeId;
    const otherId = outgoing ? raw.to : raw.from;
    const arrow = outgoing ? '&rarr;' : '&larr;';
    const relation = edgeRelation(raw);
    return `<div class="conn-row" onclick="focusNode('${otherId.replace(/'/g, "\\'")}')">
      <span class="conn-arrow">${arrow}</span>
      <span class="conn-name">${esc(nodeName(otherId))}</span>
      <span class="conn-rel">${esc(relation)}</span>
      <span class="pill ${raw.status}" style="font-size:0.6rem;">${raw.status}</span>
    </div>`;
  }).join('');
  return `<div class="conn-list">${rows}</div>`;
}

function focusNode(id) {
  if (!nodesDS.get(id)) return;
  network.selectNodes([id]);
  network.focus(id, { scale: 1.2, animation: true });
  showPanel(id, 'node');
}

function showPanel(id, kind) {
  const ds = kind === 'node' ? nodesDS : edgesDS;
  const item = ds.get(id);
  const raw = item._raw;
  selected = { id, kind };
  const panel = document.getElementById('panel');

  if (kind === 'edge') {
    const relation = edgeRelation(raw);
    panel.innerHTML = `
      <div class="field"><b>edge</b><span class="pill ${raw.status}">${raw.status}</span></div>
      <div class="field"><b>What connects</b>
        <span class="conn-name" onclick="focusNode('${raw.from.replace(/'/g, "\\'")}')">${esc(nodeName(raw.from))}</span>
        <span class="conn-rel">&rarr; ${esc(relation)} &rarr;</span>
        <span class="conn-name" onclick="focusNode('${raw.to.replace(/'/g, "\\'")}')">${esc(nodeName(raw.to))}</span>
      </div>
      <div class="field"><b>Confidence</b>${esc(raw.detail || 'unknown')}</div>
      ${raw.file ? `<div class="field"><b>File</b>${esc(raw.file)}</div>` : ''}
      <div class="field"><b>Id</b>${esc(raw.id)}</div>
      <div class="actions">
        <button class="act-btn approve" onclick="act('approve')">Approve</button>
        <button class="act-btn edit" onclick="onEdit()">Edit</button>
        <button class="act-btn reject" onclick="act('reject')">Reject</button>
      </div>
    `;
    return;
  }

  panel.innerHTML = `
    <div class="field"><b>node</b><span class="pill ${raw.status}">${raw.status}</span></div>
    <div class="field"><b>Name / meaning</b>${esc(raw.name)}</div>
    <div class="field"><b>Type</b>${esc(raw.detail || 'code')}</div>
    ${raw.file ? `<div class="field"><b>File</b>${esc(raw.file)}</div>` : ''}
    <div class="field"><b>Id</b>${esc(raw.id)}</div>
    <div class="actions">
      <button class="act-btn approve" onclick="act('approve')">Approve</button>
      <button class="act-btn edit" onclick="onEdit()">Edit</button>
      <button class="act-btn reject" onclick="act('reject')">Reject</button>
    </div>
    <div class="field"><b>Connections (in / out)</b></div>
    ${connectionsHtml(id)}
  `;
}
function clearPanel() {
  selected = null;
  document.getElementById('panel').innerHTML = '<div class="placeholder">Click a node or edge to inspect it.</div>';
}
function onEdit() {
  const label = window.prompt('New label / relation:');
  if (label && label.trim()) act('edit', label.trim());
}
async function act(action, label) {
  if (!selected) return;
  try {
    const res = await fetch('/api/review', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: selected.id, action, new_label: label || null }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'request failed');
    showToast(`${action} applied to ${data.kind} '${selected.id}'`);
    clearPanel();
    await loadGraph();
  } catch (e) {
    showToast(e.message, true);
  }
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { nodesDS.forEach(n => nodesDS.update({ id: n.id, font: { ...n.font, size: n.label ? 11 : 0 } })); return; }
  const matches = allNodes.filter(n => n.name.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)).map(n => n.id);
  if (matches.length) network.selectNodes(matches);
});

const chipMap = { 'chip-all': 'all', 'chip-red': 'red', 'chip-blue': 'blue', 'chip-green': 'green' };
Object.keys(chipMap).forEach(id => {
  document.getElementById(id).addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    const status = chipMap[id];
    if (status === 'all') { nodesDS.forEach(n => {}); network.unselectAll(); return; }
    const ids = allNodes.filter(n => n.status === status).map(n => n.id);
    network.selectNodes(ids);
  });
});
document.getElementById('chip-all').classList.add('active');

document.getElementById('chip-semantic').addEventListener('click', () => {
  semanticOnly = !semanticOnly;
  document.getElementById('chip-semantic').classList.toggle('active', semanticOnly);
  clearPanel();
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('loading').textContent = 'Re-laying out…';
  loadGraph();
});

// --- Review by group (community batch decisions) ---
// The point: 249+ individual items is too many decisions for a human to
// make one at a time. graphify's own clustering (community) is the natural
// grouping unit -- one approve/reject decision cascades to every member,
// with a click-to-preview in the main graph before committing.
async function loadCommunities() {
  const res = await fetch('/api/communities');
  const groups = await res.json();
  const list = document.getElementById('community-list');
  if (!groups.length) {
    list.innerHTML = '<div class="field placeholder">No ontology data yet.</div>';
    return;
  }
  list.innerHTML = groups.map(g => {
    const label = g.community === 'ungrouped' ? 'Ungrouped' : `Community ${g.community}`;
    const samples = g.sample_names.slice(0, 3).join(', ');
    const idsJson = esc(JSON.stringify(g.item_ids));
    return `
    <div class="community-row" onclick="previewCommunity(event, '${idsJson}')">
      <span class="cr-total">${g.total}</span>
      <div class="cr-main">
        <div>${esc(label)}</div>
        <div class="cr-samples">${esc(samples)}</div>
      </div>
      <div class="cr-counts">
        <span class="pill red">${g.red}</span>
        <span class="pill blue">${g.blue}</span>
        <span class="pill green">${g.green}</span>
      </div>
      <div class="cr-actions">
        <button class="act-btn approve" onclick="bulkAct(event, '${idsJson}', 'approve')">Approve all</button>
        <button class="act-btn reject" onclick="bulkAct(event, '${idsJson}', 'reject')">Reject all</button>
      </div>
    </div>`;
  }).join('');
}

function previewCommunity(evt, idsJson) {
  if (evt.target.closest('.cr-actions')) return; // action buttons handle their own click
  const ids = JSON.parse(idsJson.replace(/&quot;/g, '"'));
  closeCommunityOverlay();
  network.selectNodes(ids.filter(id => nodesDS.get(id)));
  if (ids.length) network.fit({ nodes: ids.filter(id => nodesDS.get(id)), animation: true });
}

async function bulkAct(evt, idsJson, action) {
  evt.stopPropagation();
  const ids = JSON.parse(idsJson.replace(/&quot;/g, '"'));
  if (action === 'reject' && !window.confirm(`Reject all ${ids.length} items in this group? This removes them from the ontology.`)) return;
  try {
    const res = await fetch('/api/review-bulk', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids, action }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'request failed');
    showToast(`${action} applied to ${data.applied} item(s)`);
    await loadCommunities();
    await loadGraph();
  } catch (e) {
    showToast(e.message, true);
  }
}

function closeCommunityOverlay() {
  document.getElementById('community-overlay').style.display = 'none';
}
document.getElementById('chip-communities').addEventListener('click', () => {
  document.getElementById('community-overlay').style.display = 'flex';
  loadCommunities();
});
document.getElementById('community-close').addEventListener('click', closeCommunityOverlay);
document.getElementById('community-overlay').addEventListener('click', e => {
  if (e.target.id === 'community-overlay') closeCommunityOverlay();
});

loadGraph();
</script>
</body>
</html>
