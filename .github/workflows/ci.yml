name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        # gitleaks/gitleaks-action requires a paid GITLEAKS_LICENSE for
        # organization repos (free for personal accounts) -- broke silently
        # the moment this repo transferred from a personal account to the
        # program-context-protocol org, 2026-08-01. The underlying gitleaks
        # binary itself is free/OSS regardless of account type; only the
        # Action wrapper is paywalled. Installing it directly instead,
        # matching the exact command the local pre-push hook already runs
        # (scripts/hooks/pre-push -- gitleaks detect --source . --no-git
        # --config .gitleaks.toml -v). The config just allowlists .pcp/
        # (gitignored, can't reach the remote regardless, but legitimately
        # full of high-entropy hashes -- symbol_fingerprints.json,
        # evidence_chain.py's hash-chained logs -- that trip the default
        # generic-api-key rule; found 2026-08-08).
        run: |
          GL_VERSION=$(curl -sS https://api.github.com/repos/gitleaks/gitleaks/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --config .gitleaks.toml -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No unrelated docs or personal/project references
        run: python3 scripts/check_public_hygiene.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Several tests build throwaway git repos and commit in them.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@localhost"
          git config --global user.name "CI"

      # Without this, every OPA-backed test (test_policy.py,
      # test_check.py's bypass-approval tests, test_build_escalation.py) is
      # silently skipped via @pytest.mark.skipif(not HAS_OPA, ...) -- meaning
      # the Decision Logic Layer had never actually been exercised by CI, on
      # any commit, ever (found via an independent cold-clone review,
      # 2026-08-12; those tests also had a separate bug, now fixed, where
      # they read policy fixtures from a local gitignored .pcp/ that only
      # ever existed on the maintainer's own machine).
      - name: Install opa
        run: |
          sudo curl -sSfL -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/latest/download/opa_linux_amd64_static
          sudo chmod +x /usr/local/bin/opa
          opa version

      - name: Install package
        run: pip install -e . pytest pytest-mock

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
