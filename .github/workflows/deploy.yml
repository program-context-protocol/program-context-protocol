name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - "src/pcp/server/**"
      - "Dockerfile"
      - "railway.toml"
      - "pyproject.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: pcp-server
